[package]
name = "valkey-largeobj"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Valkey Large Object Module — NVMe + EFA storage for KV cache tensors"
repository = "https://github.com/KarthikSubbarao/ValkeyLargeObj"

[dependencies]
valkey-module = { version = "0.1.5", features = ["min-valkey-compatibility-version-8-0"] }
valkey-module-macros = "0"
linkme = "0"
libc = "0.2"
io-uring = "0.7"
crossbeam-channel = "0.5"
dma-libfabric = { git = "https://github.com/momentohq/vdma.git", rev = "3a8d269bf819d3a8dc8d55867f88ef39b26f0296" }
dma-libfabric-protocol = { git = "https://github.com/momentohq/vdma.git", rev = "3a8d269bf819d3a8dc8d55867f88ef39b26f0296" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
lazy_static = "1"
talc = { version = "4", default-features = false, features = ["lock_api"] }

[dev-dependencies]
rstest = "0.23.0"

[lib]
crate-type = ["cdylib"]
name = "valkey_largeobj"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 0
debug = 2

[features]
default = []
enable-system-alloc = ["valkey-module/enable-system-alloc"]
