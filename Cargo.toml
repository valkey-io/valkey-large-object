[package]
name = "valkey-largeobj"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Valkey Large Object Module — NVMe + EFA storage for KV cache tensors"
repository = "https://github.com/KarthikSubbarao/ValkeyLargeObj"

[dependencies]
valkey-module = { version = "0.1.5", features = ["min-valkey-compatibility-version-8-0"] }
valkey-module-macros = "0"
linkme = "0"
libc = "0.2"
crc32c = "0.6"
io-uring = "0.7"
crossbeam-channel = "0.5"
lazy_static = "1"

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[dev-dependencies]
rstest = "0.23.0"

[lib]
crate-type = ["cdylib"]
name = "valkey_largeobj"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 0
debug = 2

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(no_efa)'] }

[features]
default = []
enable-system-alloc = ["valkey-module/enable-system-alloc"]
