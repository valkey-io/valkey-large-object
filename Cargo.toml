[package]
name = "valkey-large-object"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Valkey Large Object Module — NVMe + EFA storage for KV cache tensors"
repository = "https://github.com/KarthikSubbarao/valkey-large-object"

[dependencies]
valkey-module = { version = "0.1.14", features = ["min-valkey-compatibility-version-8-0"] }
valkey-module-macros = "0"
linkme = "0"
libc = "0.2"
crc-fast = "1"
io-uring = "0.7"
crossbeam-channel = "0.5"
dma-libfabric = { git = "https://github.com/momentohq/vdma.git", rev = "e2679fb03fb62daf4c04d15c2cf89772788857bf" }
dma-libfabric-protocol = { git = "https://github.com/momentohq/vdma.git", rev = "e2679fb03fb62daf4c04d15c2cf89772788857bf" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
indexmap = "2"
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
lazy_static = "1"
nvme-telem = "0.3.3"
rand = "0.10"
talc = { version = "5", default-features = false, features = ["counters"] }
# For the `Allocator` trait talc's TalcCell implements (safe allocate/deallocate).
# Pinned to the version talc itself uses so there is a single shared trait.
allocator-api2 = { version = "0.4", default-features = false }

[dev-dependencies]
rstest = "0.23.0"
tokio = { version = "1", features = ["test-util"] }
serial_test = "3"

[lib]
crate-type = ["cdylib"]
name = "valkey_large_object"

# The passive libfabric peer for integration tests.
[[bin]]
name = "fabric_target"
path = "tests/harness/fabric_target.rs"
required-features = ["test-harness"]

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 0
debug = 2

[features]
default = []
enable-system-alloc = ["valkey-module/enable-system-alloc", "valkey-module/test-shims"]
test-harness = []
